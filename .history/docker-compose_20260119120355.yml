version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_apache
    restart: unless-stopped
    ports:
      - "8081:80"                     # Symfony sur http://localhost:8081
    volumes:
      - ./app:/var/www/html           # Code Symfony
      - symfony_var:/var/www/html/var # Cache & logs Symfony
    env_file:
      - .env.docker
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: symfony_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel_guide
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      TZ: Europe/Paris
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./travel_guide.sql:/docker-entrypoint-initdb.d/travel_guide.sql # Import automatique

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: symfony_phpmyadmin
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "8082:80"                     # phpMyAdmin sur http://localhost:8082
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: symfony
      PMA_PASSWORD: symfony
      UPLOAD_LIMIT: 64M

volumes:
  db_data:
  symfony_var:
